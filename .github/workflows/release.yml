name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: devproxy-linux-x86_64
          - os: windows-latest
            artifact: devproxy-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
        env:
          DEVPROXY_NATIVE_SECRET_TEST: '1'
      - run: python -m PyInstaller --onefile --clean --name devproxy devproxy.py
      - name: Verify executable and package
        run: python scripts/package_release.py --name ${{ matrix.artifact }} --output release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
